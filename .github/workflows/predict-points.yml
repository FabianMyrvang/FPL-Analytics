name: Predict player points

on:
  workflow_dispatch:        # manual "Run workflow" button — runs regardless of season
  workflow_run:
    # Chained to the data pipeline rather than run on a clock. Predictions only move when a new
    # gameweek's results land, and that happens on no fixed schedule — the FPL API flips a
    # gameweek to `finished` once bonus points are confirmed, hours after the last match. A daily
    # cron would mostly recompute identical numbers and would still be up to 24h late when it
    # mattered.
    #
    # `workflow_run` rather than `on: push`: commits made with the default GITHUB_TOKEN
    # deliberately do not raise push events, so a path filter on FPL_DATA/ would never fire.
    # workflow_run is the supported way to chain off a bot commit.
    #
    # This fires after EVERY update-data run, most of which change nothing, so the gate step
    # below exits in seconds before installing anything.
    workflows: ["Update FPL data"]
    types: [completed]

permissions:
  contents: write           # allow the bot to commit refreshed predictions back to the repo

concurrency:
  group: predict-points     # a different group from update-data, so the two never block
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run pins GITHUB_SHA to the default branch as it was when the TRIGGERING
          # workflow started, which predates the data commit that workflow just pushed. Check
          # out main explicitly so this job sees the fresh data.
          ref: main

      - name: New-data guard (skip unless a gameweek has completed)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pred="FPL_DATA/fact_player_points_prediction.csv"
          if [ ! -f "$pred" ]; then
            echo "No existing predictions — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest gameweek present in the results, vs the gameweek the published predictions
          # were built from. 02_fpl_api.py only ingests gameweeks the FPL API has flagged
          # `finished` (i.e. bonus points settled), so this is a reliable "new results landed"
          # signal. Done in awk so nothing is installed on the common no-op path.
          latest=$(awk -F, 'NR>1 && $2+0>m {m=$2+0} END {print m+0}' FPL_DATA/fact_fpl_player_gw.csv)
          built=$(awk -F, 'NR==2 {print $NF+0}' "$pred")
          echo "Results through gw $latest; predictions built from gw $built."
          if [ "$latest" = "$built" ]; then
            echo "No completed gameweek since the last run — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "New gameweek data — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-model.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements-ci.txt -r requirements-model.txt

      - name: Train models and predict the next 3 gameweeks
        if: steps.guard.outputs.run == 'true'
        env:
          MPLBACKEND: Agg
        run: python scripts/05_fpl_predict_points.py

      - name: Commit & push predictions
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths, never FPL_DATA/*.csv — this workflow must not commit files that
          # update-data.yml owns, in case it is mid-run.
          git add FPL_DATA/fact_player_points_prediction.csv \
                  FPL_DATA/fact_player_points_prediction_history.csv \
                  FPL_DATA/dim_model.csv \
                  exports/fpl_points_predictions.xlsx
          if git diff --cached --quiet; then
            echo "No prediction changes to commit."
          else
            git commit -m "Update point predictions ($(date -u +%Y-%m-%d))"
            # Rebase AFTER committing: update-data.yml also pushes to main and the two can
            # overlap, but `git pull --rebase` refuses to run with a dirty working tree, so
            # this has to come once the changes are safely in a commit.
            git pull --rebase origin main
            git push
          fi
