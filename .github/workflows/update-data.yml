name: Update FPL data

on:
  workflow_dispatch:        # manual "Run workflow" button — runs regardless of season
  schedule:
    # Daily at 05:23 UTC. GitHub's scheduler is best-effort and consistently adds 35-55
    # minutes of drift, so this lands around 06:00-06:20 UTC — an hour before the Power BI
    # refresh at 09:00 Oslo (07:00 UTC in summer). :23 avoids :00/:15/:30/:45, the most
    # contended slots. Runs can still be delayed by hours or dropped entirely; the second
    # Power BI refresh at 18:00 Oslo is what covers that.
    #
    # The season-guard step skips the off-season, so the schedule wakes up on its own each
    # 25 August.
    - cron: "23 5 * * *"

permissions:
  contents: write           # allow the bot to commit refreshed data back to the repo

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Season guard (skip off-season unless triggered manually)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of season."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Off-season runs June, July and the first 24 days of August. The season
            # opens around 21 August, but GW1 results aren't final until a few days
            # later, so there is nothing worth refreshing before 25 August.
            m=$(date -u +%m)
            d=$(date -u +%-d)
            if [ "$m" = "06" ] || [ "$m" = "07" ] || { [ "$m" = "08" ] && [ "$d" -lt 25 ]; }; then
              echo "Off-season (month $m, day $d) — skipping scheduled run."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "In-season (month $m, day $d) — proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements-ci.txt

      - name: Clone FPL-Core-Insights (Opta data source)
        if: steps.guard.outputs.run == 'true'
        run: git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git

      - name: Run pipeline (FPL API -> elo player stats)
        if: steps.guard.outputs.run == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/02_fpl_api.py
          python scripts/03_fpl_elo_player.py

      - name: Commit & push updated data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FPL_DATA/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update FPL data ($(date -u +%Y-%m-%d))"
            git push
          fi
