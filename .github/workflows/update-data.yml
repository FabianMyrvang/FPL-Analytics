name: Update FPL data

on:
  workflow_dispatch:        # manual "Run workflow" button — runs regardless of season
  schedule:
    # Frequent rather than well-timed, for two reasons:
    #
    #   1. The source is event-driven. The FPL API flips a gameweek to `finished` only once
    #      bonus points are confirmed — hours after the last match, at no fixed time. A daily
    #      poll misses that by up to 24h no matter which hour it runs. GW2 of 2026-27 was
    #      missed exactly this way.
    #   2. GitHub's scheduler is best-effort: missed runs are DROPPED, not queued or run late,
    #      and leave no record. Polling often is the only defence.
    #
    # Cheap: each run rebuilds all finished gameweeks and upserts, the commit step is gated on an
    # actual diff, and a run takes ~60s. Public repos have unlimited Actions minutes. Most runs
    # log "No data changes to commit."
    #
    # --- Slot choice is measured, not guessed --------------------------------------------
    # Delivery rates over 100 runs / 35 days on the previous "17 2,6,10,14,18,22" schedule:
    #
    #     02:17 UTC   0%   <- never fired once in 35 days. Removed.
    #     06:17 UTC  83%
    #     10:17 UTC  23%   <- moved to 11:17 as an experiment, see below
    #     14:17 UTC  66%
    #     18:17 UTC  57%
    #     22:17 UTC  57%
    #
    # Two changes from the original "17 2,6,10,14,18,22":
    #   * 02:17 dropped as provably dead.
    #   * 10:17 moved to 11:17. It delivered only 23%, and it is the slot that covers the window
    #     where the FPL API actually flips a gameweek to `finished`. Losing it cost ~8 hours on
    #     GW5: the bot found nothing at 10:01 Norwegian time, the 12:17 slot was dropped, and the
    #     next successful check was 18:29.
    #
    # CAVEAT on that 23%: runs land 1-2h after their slot, and a badly delayed 10:17 run would
    # arrive around 14:xx and be counted against the 14:17 slot instead. So 10:17 may be less
    # dead than it looks, and 14:17's 66% correspondingly flattered. 11:17 is an experiment, not
    # a known improvement — re-measure delivery rates in a few weeks before drawing conclusions.
    #
    # In Norwegian time these fire at 08:17, 13:17, 16:17, 20:17 and 00:17 — one hour earlier
    # once winter time starts, since cron is always UTC while a Power BI schedule set in local
    # time is not. The two drift apart twice a year.
    #
    # :17 avoids :00/:15/:30/:45, the most contended minutes. The season-guard step skips the
    # off-season, so the schedule wakes up on its own each 25 August.
    - cron: "17 6,11,14,18,22 * * *"

permissions:
  contents: write           # allow the bot to commit refreshed data back to the repo

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Season guard (skip off-season unless triggered manually)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of season."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Off-season runs June, July and the first 24 days of August. The season
            # opens around 21 August, but GW1 results aren't final until a few days
            # later, so there is nothing worth refreshing before 25 August.
            m=$(date -u +%m)
            d=$(date -u +%-d)
            if [ "$m" = "06" ] || [ "$m" = "07" ] || { [ "$m" = "08" ] && [ "$d" -lt 25 ]; }; then
              echo "Off-season (month $m, day $d) — skipping scheduled run."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "In-season (month $m, day $d) — proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements-ci.txt

      - name: Clone FPL-Core-Insights (Opta data source)
        if: steps.guard.outputs.run == 'true'
        run: git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git

      - name: Run pipeline (FPL API -> detailed player stats)
        if: steps.guard.outputs.run == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/02_fpl_api.py
          python scripts/03_fpl_detailed_player.py

      - name: Commit & push updated data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add the directory, not FPL_DATA/*.csv: a glob expands to ignored files too and
          # `git add` then exits 1, failing the step. Adding the directory honours .gitignore
          # silently, which matters now that some CSVs in there are deliberately untracked.
          git add FPL_DATA/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update FPL data ($(date -u +%Y-%m-%d))"
            git push
          fi
