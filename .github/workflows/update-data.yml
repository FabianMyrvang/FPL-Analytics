name: Update FPL data

on:
  workflow_dispatch:        # manual "Run workflow" button — runs regardless of season
  schedule:
    # Polled frequently rather than scheduled precisely. The FPL API marks a gameweek
    # finished on its own schedule after the last match, and GitHub's cron is best-effort:
    # missed runs are dropped, not deferred. A run costs ~60s, Actions minutes are free on
    # public repos, and the commit step is gated on a real diff, so extra polls are cheap.
    #
    # Slots are UTC (08:17, 13:17, 16:17, 20:17, 00:17 Norwegian during CEST). :17 avoids
    # the contended :00/:15/:30/:45 minutes. The season-guard step below skips the
    # off-season, so the schedule resumes on its own each 25 August.
    - cron: "17 6,11,14,18,22 * * *"

permissions:
  contents: write           # allow the bot to commit refreshed data back to the repo

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Season guard (skip off-season unless triggered manually)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of season."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Off-season runs June, July and the first 24 days of August. The season
            # opens around 21 August, but GW1 results aren't final until a few days
            # later, so there is nothing worth refreshing before 25 August.
            m=$(date -u +%m)
            d=$(date -u +%-d)
            if [ "$m" = "06" ] || [ "$m" = "07" ] || { [ "$m" = "08" ] && [ "$d" -lt 25 ]; }; then
              echo "Off-season (month $m, day $d) — skipping scheduled run."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "In-season (month $m, day $d) — proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements-ci.txt

      - name: Clone FPL-Core-Insights (Opta data source)
        if: steps.guard.outputs.run == 'true'
        run: git clone --depth 1 https://github.com/olbauday/FPL-Core-Insights.git

      - name: Run pipeline (FPL API -> detailed player stats)
        if: steps.guard.outputs.run == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/02_fpl_api.py
          python scripts/03_fpl_detailed_player.py

      - name: Commit & push updated data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add the directory, not FPL_DATA/*.csv — a glob expands to ignored files and
          # `git add` then exits 1. Adding the directory honours .gitignore silently.
          git add FPL_DATA/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update FPL data ($(date -u +%Y-%m-%d))"
            git push
          fi
